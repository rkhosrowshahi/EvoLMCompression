[project]
name = "evolmc"
version = "0.1.0"
description = "Multi-objective post-training compression search for language models"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "pymoo>=0.6.1",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
data = ["datasets>=2.18"]
eval = ["lm-eval>=0.4.2"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["evolmc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
