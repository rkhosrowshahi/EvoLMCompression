model:
  name: gpt2
  dtype: float16
  device: cuda
  master_device: cuda
  exclude_patterns: [lm_head, embed, wte, wpe]

quant:
  granularity: per_tensor
  binning: widths
  k_fixed: 256
  codebook_bits: 16
  cache_entries: 32
  widths_log_lo: -14.0
  widths_log_hi: 2.0

prune:
  enabled: false

variables:
  k_grouping: block_type
  prune_grouping: global

data:
  calib_dataset: c4
  eval_dataset: wikitext2
  seqlen: 1024
  n_proxy_seq: 8
  n_eval_seq: 128

search:
  algorithm: nsga2
  pop_size: 100
  n_gen: 100
  seed: 0

  # avg_bits (deployable, fixed-width indices) is a hard CONSTANT under
  # k_fixed: ceil(log2(k_nominal)) + codebook bits is identical for every
  # individual regardless of how the width genes shape bin occupancy, so it
  # gives the search zero signal (worst case zero for k_grouping: global,
  # still effectively zero for block/layer since GPT-2's real layers never
  # trigger the per-layer K cap that could otherwise vary it). avg_bits_archival
  # (Huffman-coded) is what actually responds to the width genes, since it
  # prices the skewed symbol distribution they produce -- that skew
  # exploitation is the mechanism DNN compression/REPORT.md's method relies
  # on, so it needs to be the objective being optimized.
  objectives: [ppl_proxy, avg_bits_archival]

  init: ladder
  warm_start: true
  baseline_sweep: true
  size_objective: avg_bits_archival

  crossover_prob: 0.9
  crossover_prob_var: 1.0
  crossover_eta: 15
  mutation_prob: 0.9
  mutation_prob_var: 0.9
  mutation_eta: 20
  eliminate_duplicates: true
  n_offsprings: null
  ref_dir_partitions: null
  moead_neighbors: 15
  moead_prob_neighbor_mating: 0.7

log:
  root: logs
  run_name: gpt2_124m-widths-only_proj-layer_quant-2obj-np100-ng100-k256
  checkpoint_every: 10
  save_history: true

plot:
  enabled: true
  every: 1
  formats: [png, pdf]
  dpi: 150
  style: paper
  yscale: log
  ylim_min: 1.0
  ylim_min_ratio: 0.8
  ylim_pad: 0.03
  ylim_max: null
  ylim_max_ratio: null
  legend_alpha: 0.3
  marker_pt: 3.5
  baseline_label: exponential search (baseline)
  annotation_pt: null
  venue: ieee
  width: column
  video: [mp4, gif]
  video_fps: 6
