model:
  name: EleutherAI/pythia-410m
  dtype: float16
  device: cuda
  master_device: cuda

quant:
  deployable_format: bitmap
  granularity: per_channel
  binning: uniform
  k_choices: [2, 4, 8, 16, 32, 64, 128, 256]
  codebook_bits: 16

prune:
  enabled: true
  mode: sigma
  t_max: 2.0

variables:
  k_grouping: type
  prune_grouping: type

data:
  calib_dataset: c4
  eval_dataset: wikitext2
  seqlen: 2048
  n_proxy_seq: 8
  n_eval_seq: 128

search:
  algorithm: nsga2
  pop_size: 40
  n_gen: 40
  seed: 0
  warm_start: true
  size_objective: avg_bits

log:
  root: logs
  checkpoint_every: 5
  save_history: true

plot:
  xlim_min: 1.0
  enabled: true
  every: 1
  formats: [png, pdf]
  dpi: 150
  style: paper
  yscale: log
  figsize: [7.0, 5.0]
