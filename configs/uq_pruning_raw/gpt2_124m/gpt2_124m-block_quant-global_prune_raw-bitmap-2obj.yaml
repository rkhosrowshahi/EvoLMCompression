model:
  name: gpt2
  dtype: float16
  device: cuda
  master_device: cuda
  exclude_patterns: [lm_head, embed, wte, wpe]

quant:
  granularity: per_tensor
  binning: uniform
  k_encoding: integer
  k_min: 2
  k_max: 8192
  k_choices: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
  codebook_bits: 16
  deployable_format: bitmap
  csr_span_bits: 4
  cache_entries: 32

prune:
  enabled: true
  # See the Global sibling config for why "raw" (absolute weight-value
  # threshold, not rescaled per row) rather than "sigma" here.
  mode: raw
  # Same t_max as the Global raw-pruning config -- see that file's comment.
  # The weight-magnitude stats it is based on come from the whole only_proj
  # target set, independent of quantization granularity.
  t_max: 1.0
  reserve_zero_codeword: true

variables:
  k_grouping: block
  prune_grouping: global

data:
  calib_dataset: c4
  eval_dataset: wikitext2
  seqlen: 1024
  n_proxy_seq: 8
  n_eval_seq: 128

search:
  algorithm: nsga2
  pop_size: 100
  n_gen: 100
  seed: 0

  objectives: [ppl_proxy, avg_bits]

  init: logspace
  warm_start: true
  baseline_sweep: true
  size_objective: avg_bits

  # Same NSGA-II operator settings as the alpha in [12,48] companding configs.
  crossover_prob: 0.9
  crossover_prob_var: 1.0
  crossover_eta: 15
  mutation_prob: 0.9
  mutation_prob_var: 0.9
  mutation_eta: 20
  eliminate_duplicates: true
  n_offsprings: null
  ref_dir_partitions: null
  moead_neighbors: 15
  moead_prob_neighbor_mating: 0.7

log:
  root: logs
  run_name: gpt2_124m-block_quant-global_prune_raw-bitmap-2obj-np100-ng100
  checkpoint_every: 10
  save_history: true

plot:
  enabled: true
  every: 1
  formats: [png, pdf]
  dpi: 150
  style: paper
  yscale: log
  ylim_min: 1.0
  ylim_min_ratio: 0.8
  ylim_pad: 0.03
  ylim_max: null
  ylim_max_ratio: null
  xlim_min: 1.0
  xlim_max: null
  legend_alpha: 0.3
  marker_pt: 3.5
  baseline_label: exponential search (baseline)
  annotation_pt: null
  venue: ieee
  width: column
  video: [mp4, gif]
  video_fps: 6
