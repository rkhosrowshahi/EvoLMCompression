# GPT-2 codebook-size sweep, THREE objectives -- block-wise K (12 variables)
#
# Paired with gpt2_k_block.yaml. Everything below is identical to that file
# except `search.objectives`, so the difference between the two runs is
# attributable to the third objective alone.
#
#   gpt2_k_global_3obj.yaml   1 variable   -- one K for the whole model
#   gpt2_k_block_3obj.yaml    12 variables -- one K per transformer block
#   gpt2_k_layer_3obj.yaml    48 variables -- one K per layer
#
# -- why three objectives -----------------------------------------------------
#
# f1  ppl_proxy    proxy perplexity on the held-in calibration windows  (min)
# f2  bpw_target   DEPLOYABLE bits per weight over the target matrices  (min)
# f3  cr_archival  ARCHIVAL compression ratio over the whole checkpoint (MAX)
#
# f2 and f3 are not the same number in different units. f2 is built from
# `target_bits_deployable` (fixed-width indices, what a LUT dequant kernel
# reads) and f3 from `target_bits_archival` (entropy-coded, what a checkpoint
# costs to store). See codec.py -- the two totals are computed separately and
# nothing links them algebraically.
#
# The pairing that DOES NOT work, for reference: cr_deployable is exactly
# 16 / bpw_model, so putting it opposite any bits-per-weight objective yields a
# front numerically identical to the 2-objective run. Verified on the finished
# runs: cr_deployable * bpw_model == 16.000 for every front member.
#
# Scope differs between f2 and f3 on purpose. f2 covers the 84.9M compressed
# projection weights, which is what GPTQ/AWQ/SqueezeLLM tables quote. f3 covers
# all 124.4M including the 39.5M fp16 embeddings that are never touched, which
# is the honest end-to-end figure. So 16/f2 will NOT equal f3, and the axis
# labels have to name the scope or a reader will try the arithmetic and get
# confused. Reporting both scopes was going to be necessary anyway; this puts
# them on the two axes directly.
#
# Note bpw_target vs bpw_model is a pure rescale for the search: bpw_model is
# an affine increasing function of bpw_target, (n_t*bpw_target + 16*n_u)/n_tot,
# so dominance is identical. bpw_target is used because its visible axis spans
# 1..16 (16.0x) against bpw_model's 5.08..16 (3.15x) -- GPT-2's untouched
# embeddings floor bpw_model at 5.079 no matter how hard the search compresses.
#
# -- how much conflict to expect ----------------------------------------------
#
# Measured over all 9,989 evaluations of the paired 2-objective runs. Note the
# correlation is high but that is the wrong statistic; dominance only cares
# about ordering, and 4% of pairs disagreeing is plenty for NSGA-II.
#
#   run      Pearson  Spearman  Kendall  discordant  |nondom| 2-obj -> 3-obj
#   global    0.974    0.9994    0.9946     0.27%      1698 -> 1698   (+0)
#   block     0.989    0.9895    0.9185     4.08%       300 ->  377  (+26%)
#   layer     0.991    0.9906    0.9267     3.67%       326 ->  401  (+23%)
#
# cr_archival spread among candidates at MATCHED bpw_target:
#
#   bpw_target    global   block   layer
#      ~2          1.5%     7.4%    7.7%
#      ~3          1.6%    13.5%   15.4%
#      ~4          2.4%    19.0%   20.7%
#      ~6          7.7%    22.8%   24.9%
#      ~8          8.7%    17.6%   17.0%
#
# THIS IS WHERE THE THIRD OBJECTIVE STARTS TO PAY. Twelve variables let K vary
# between blocks, and two genomes with the same total deployable cost can put
# their bits in different places, producing symbol histograms of different
# entropy. At ~6 bpw the archival ratio spans 22.8% across candidates the
# 2-objective search treats as equivalent. The conflict peaks mid-range: at
# very low bpw everything saturates near maximum compression, and at high bpw
# the fp16 codebook term swamps the entropy differences. Keep 4-6 bpw sampled.
#
# -- the rest -----------------------------------------------------------------
#
# Search space: any INTEGER K in [2, 8192], no pruning.
#
# 1. granularity is per_tensor (ONE codebook per layer), not per_channel.
#    A K of 10^4 is only meaningful this way. GPT-2 rows hold 768 weights, so
#    a per-channel codebook can never fill more than 768 entries, and storing
#    8192 fp16 centroids for a 768-weight row costs 170 bpw of codebook alone.
#    Per tensor the same codebook costs 0.06 bpw. This is also the original
#    Deep Compression setup, which makes it the right baseline for the method.
#
# 2. k_encoding is `integer`: the search may pick any K in [2, 8192], not just
#    powers of two. The mapping is LOG-spaced, because the cost axis is index
#    width = log2(K); a linear map would spend half the gene range above
#    K=4096, where quality has long plateaued, and leave almost no resolution
#    at small K, which is the regime that matters.
#
#    At per_tensor this buys less than it looks. Index width is ceil(log2 K),
#    so every K inside a band costs the same indices and differs only in
#    codebook size -- a band spans ~0.0004 bpw on GPT-2. It matters more here
#    than in the 2-objective run, though: K within a band is invisible to f2
#    but NOT to f3, since it changes the symbol histogram the entropy coder
#    sees. Intra-band K is exactly the freedom the third objective exploits.
#
# 3. k_choices no longer bounds the search. It is now only the ladder of
#    reference points: the fixed-bit baselines the front must beat and the
#    anchors for the frozen plot axes.
#
# 4. K is capped PER GROUP at the number of values that group's codebook can
#    actually fill, so the space is prod_g (k_max_g - 1), not k_max ** n_groups.
#    At per_tensor on GPT-2 the cap never binds (the smallest layer still holds
#    589,824 values), so here the space really is ~8191 per variable.

model:
  name: gpt2
  dtype: float16
  device: cuda
  master_device: cuda

quant:
  granularity: per_tensor    # see note 1
  binning: uniform           # the proposed method
  k_encoding: integer        # see note 2
  k_min: 2
  k_max: 8192
  k_choices: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
  codebook_bits: 16
  # Small on purpose. The (layer, K) cache only pays when K repeats, and with
  # a continuous integer search almost every candidate is a fresh K -- a large
  # cache would hold full weight tensors for a near-zero hit rate.
  cache_entries: 32

prune:
  enabled: false             # this sweep isolates K
  # Pruning would widen the f2/f3 conflict further: t_lo/t_hi move counts[0]
  # in the symbol histogram, which f3 sees and f2 cannot (the reserved zero
  # codeword keeps the index width at exactly ceil(log2 K) no matter how much
  # is pruned). Left off here so this stays a one-line diff from the finished
  # 2-objective runs; the measurements above show f2 and f3 already conflict
  # at block and layer granularity without it.

variables:
  k_grouping: block              # <-- THE ONLY LINE THAT DIFFERS
  prune_grouping: global     # unused while prune.enabled is false

data:
  calib_dataset: c4
  eval_dataset: wikitext2
  seqlen: 1024               # GPT-2's context window
  n_proxy_seq: 8             # fitness signal during the search
  n_eval_seq: 64             # full evaluation of the final front

search:
  algorithm: nsga2
  pop_size: 100
  n_gen: 100
  seed: 0

  # -- objectives -------------------------------------------------------------
  # Names match the keys in ModelCost.summary() (codec.py), plus `ppl_proxy`
  # for the fitness. Direction is implied by the name: everything is minimized
  # except the cr_* ratios, which are maximized and negated internally.
  #
  # Two objectives here reproduces the paired 2-objective run exactly.
  objectives: [ppl_proxy, bpw_target, cr_archival]

  # Generation 0 is pop_size uniform-K individuals with K spread evenly in LOG
  # space, so it lies exactly on the fixed-bit baseline curve and spans it end
  # to end. Any later movement is then unambiguously the search's doing.
  # Diversity in the relative K between groups comes from SBX/PM afterwards.
  init: linspace
  warm_start: true
  baseline_sweep: true       # the 13 fixed-K reference points
  # Subsumed by `objectives` above; still selects the bpw measure used to
  # derive the frozen x box and the baseline sweep's printout. Keep it equal
  # to whichever bpw_* appears in `objectives` or the axes will not match.
  size_objective: bpw_target

  # -- NSGA-II operator controls ---------------------------------------------
  # pymoo gives each operator TWO probabilities. `prob` is the chance the
  # operator fires on an individual (or mating pair) at all; `prob_var` is the
  # chance each gene is touched once it has. The familiar "1/n_var" rule refers
  # to prob_var, and pymoo already defaults it to min(0.5, 1/n_var) -- so leave
  # mutation_prob_var null to get it. Putting 1/n_var into mutation_prob
  # instead silently mutates only 1/n_var of the population: 2% here at 48
  # variables, 0.1% for a per-layer Llama-2 encoding.
  crossover_prob: 0.9        # per mating pair
  crossover_prob_var: 1.0    # per gene, given the pair crosses
  crossover_eta: 15          # SBX spread; higher = children hug their parents
  mutation_prob: 1.0         # per individual
  mutation_prob_var: 1.0    # per gene; null -> 1/n_var
  mutation_eta: 20           # PM spread; higher = smaller steps
  eliminate_duplicates: true
  n_offsprings: null         # null -> pop_size (generational)
  ref_dir_partitions: null   # unsga3/moead only; null -> pop_size - 1
  moead_neighbors: 15
  moead_prob_neighbor_mating: 0.7

log:
  root: logs
  run_name: gpt2-k-block-3obj-np100-ng100
  checkpoint_every: 10
  save_history: true

plot:
  enabled: true
  every: 1
  formats: [png, pdf]
  dpi: 150
  style: paper
  yscale: log
  # y floor = ylim_min_ratio x fp16 perplexity. 0.8 leaves more room under
  # the fp16 line than the 0.9 default, so a candidate that ties or edges past
  # the uncompressed model is clearly separated from it rather than hugging
  # the axis.
  # Absolute floor: 1.0 is the theoretical minimum, since perplexity is
  # exp(cross-entropy) and cross-entropy is non-negative. Overrides
  # ylim_min_ratio, is not padded, and refit never moves it.
  ylim_min: 1.0
  ylim_min_ratio: 0.8      # unused while ylim_min is set
  ylim_pad: 0.03            # breathing room at both ends, in decades
  # Ceiling, mirroring the floor. null = no cap: the box opens to the highest
  # reference point and refit_at_end raises it to cover every candidate, so
  # nothing is ever off-scale. ylim_max sets an absolute value instead;
  # ylim_max_ratio caps at that multiple of fp16.
  ylim_max: null
  ylim_max_ratio: null
  legend_alpha: 0.3
  marker_pt: 3.5             # front/baseline marker diameter (pt)
  baseline_label: exponential search (baseline)
  annotation_pt: null        # null -> base font - 3 (5pt at the ieee preset)
  venue: ieee                # 3.5 in column figures, Times
  width: column
  video: [mp4, gif]
  video_fps: 6
