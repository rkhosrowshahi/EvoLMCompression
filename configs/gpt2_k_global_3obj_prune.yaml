# GPT-2 sweep, THREE objectives + PRUNING -- global K (1 K var + 2 prune vars)
#
# Paired with gpt2_k_global_3obj.yaml. Everything below is identical to that
# file except the `prune` block and `log.run_name`, so the difference between
# the two runs is attributable to pruning alone.
#
#   gpt2_k_global_3obj_prune.yaml    3 variables  (1 K  + 2 prune)
#   gpt2_k_block_3obj_prune.yaml    14 variables  (12 K + 2 prune)
#   gpt2_k_layer_3obj_prune.yaml    50 variables  (48 K + 2 prune)
#
# -- objectives ---------------------------------------------------------------
#
# f1  ppl_proxy    proxy perplexity on the held-in calibration windows  (min)
# f2  bpw_target   DEPLOYABLE bits per weight over the target matrices  (min)
# f3  cr_archival  ARCHIVAL compression ratio over the whole checkpoint (MAX)
#
# f2 is built from `target_bits_deployable` (fixed-width indices, what a LUT
# dequant kernel reads); f3 from `target_bits_archival` (entropy-coded, what a
# checkpoint costs to store). Different bit totals, so nothing links them
# algebraically. Pairing two measures from the SAME total -- e.g. bpw_model
# with cr_deployable, which is exactly 16/bpw_model -- reproduces the
# 2-objective front exactly; the search warns at startup if you try it.
#
# -- WHY PRUNING IS THE POINT HERE --------------------------------------------
#
# Pruned weights are folded into the codebook as a reserved zero codeword
# rather than carried in a separate bitmask (quantize.py). The consequence is
# exact and is the whole reason this config exists:
#
#   kc = k - 1 when pruning is active, and k_centroids = kc + 1 = k.
#   Index width stays ceil(log2 K). Codebook stays n_groups * k * 16 bits.
#   => DEPLOYABLE COST IS UNCHANGED BY PRUNING. Byte for byte.
#
# So t_lo and t_hi are invisible to f2 and fully visible to f3, which sees the
# symbol histogram collapse onto symbol 0 and the Huffman cost fall with it.
# Two genes that move one size objective and not the other is precisely the
# structure a 3-objective front needs.
#
# Without pruning the two size axes still conflict, but only through how K is
# distributed between groups -- which is why the no-prune global config is
# effectively 2-D (one K is a one-parameter family). Pruning adds a knob that
# is orthogonal to K entirely, so even THIS config gets a genuine third axis.
# That is the specific thing to check in the results.
#
# -- the pruning band ---------------------------------------------------------
#
# mode: sigma means the threshold is t x the per-output-row weight scale (std),
# which is well conditioned across layers of very different magnitude. For a
# roughly Gaussian weight distribution:
#
#   t=0.25 -> 19.7% pruned     t=1.00 -> 68.3%     t=1.64 -> 89.9%
#   t=0.50 -> 38.3%            t=1.28 -> 79.9%     t=2.00 -> 95.4%
#   t=0.75 -> 54.7%            t=1.50 -> 86.6%
#
# t_max: 2.0 therefore covers the whole useful range with roughly the top
# quarter of the gene wasted on sparsities that will destroy the model. That is
# the right trade: capping lower risks truncating the front, and f3 rewards
# sparsity hard enough that the search may genuinely want 85-90%.
#
# The band is TWO genes, not one, so it need not be symmetric about zero:
# (t_lo, t_hi) = (-0.60, +1.40) is reachable and prunes more from the positive
# side. Only the linspace seeds are symmetric.
#
# -- what changes vs the no-prune run -----------------------------------------
#
# 1. GENERATION 0 IS NO LONGER THE BASELINE CURVE. With pruning on, linspace
#    sweeps K and t TOGETHER along one diagonal: individual 0 is (K=2, t=0),
#    the last is (K=8192, t=2.0). Only the first sits on the fixed-K reference
#    line. Both axes are still spanned marginally, and SBX/PM decorrelate them
#    within a few generations, but the "gen 0 lies exactly on the fixed-bit
#    baseline curve" claim from the no-prune configs does NOT hold here. Do not
#    repeat it in the paper for these runs.
#
#    The baseline sweep itself is unaffected: it calls encode_uniform(k) with
#    t=0, so the reference curve stays the un-pruned fixed-bit curve, which is
#    the correct thing to compare against.
#
# 2. THE RECONSTRUCTION CACHE IS DISABLED. It only caches pruning-independent
#    results, so `prune.enabled: true` turns it off wholesale
#    (compressor.py). Measured cost: `apply` is ~78% of an evaluation on the
#    finished runs, but at k_encoding: integer almost every candidate already
#    carried a fresh K, so the hit rate was near zero and little is actually
#    lost. Budget roughly the same 35-40 minutes per run, plus the masking pass.
#
# 3. +2 VARIABLES. 1 -> 3 here. prune_grouping stays `global` in all three
#    configs so that k_grouping remains the only thing that varies across the
#    sweep; per-block or per-layer thresholds would add 24 or 96 more variables
#    and confound the granularity comparison with a dimensionality jump.
#    One global threshold is already sufficient to decorrelate f2 from f3:
#    for ANY fixed K vector, moving t moves f3 and leaves f2 exactly where it
#    was.
#
# -- the rest -----------------------------------------------------------------
#
# Search space: any INTEGER K in [2, 8192], plus a pruning band in [0, 2] sigma.
#
# 1. granularity is per_tensor (ONE codebook per layer), not per_channel.
#    A K of 10^4 is only meaningful this way. GPT-2 rows hold 768 weights, so
#    a per-channel codebook can never fill more than 768 entries, and storing
#    8192 fp16 centroids for a 768-weight row costs 170 bpw of codebook alone.
#    Per tensor the same codebook costs 0.06 bpw. This is also the original
#    Deep Compression setup, which makes it the right baseline for the method.
#
# 2. k_encoding is `integer`: the search may pick any K in [2, 8192], not just
#    powers of two, mapped LOG-spaced because the cost axis is index width
#    log2(K). Note K=2 with pruning active leaves kc=1, i.e. one centroid for
#    every survivor -- a legitimate "prune or replace by the mean" corner.
#
# 3. k_choices is only the ladder of reference points: the fixed-bit baselines
#    the front must beat and the anchors for the frozen plot axes.
#
# 4. K is capped PER GROUP at what that group's codebook can fill. At
#    per_tensor on GPT-2 the cap never binds (the smallest layer holds 589,824
#    values), so the space really is ~8191 per K variable.

model:
  name: gpt2
  dtype: float16
  device: cuda
  master_device: cuda

quant:
  granularity: per_tensor    # see note 1
  binning: uniform           # the proposed method
  k_encoding: integer        # see note 2
  k_min: 2
  k_max: 8192
  k_choices: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
  codebook_bits: 16
  # Irrelevant while pruning is on -- the cache is disabled wholesale, because
  # a pruning-dependent reconstruction is not a function of (layer, K) alone.
  # Left at the no-prune value so the diff against the paired config is small.
  cache_entries: 32

prune:
  enabled: true              # <-- THE BLOCK THAT DIFFERS from the 3obj config
  mode: sigma                # threshold = t x per-output-row std; see above
  t_max: 2.0                 # up to ~95% sparsity; the useful range is 0.5-1.6
  # THE MECHANISM. Folding pruned weights into the codebook as a reserved zero
  # codeword costs no extra index bits, so the deployable cost (f2) does not
  # move at all and the whole effect lands on the entropy-coded cost (f3).
  # Setting this false would make pruning cost mask bits, put it back on f2,
  # and collapse the very separation this experiment is built to measure.
  reserve_zero_codeword: true

variables:
  k_grouping: global             # <-- THE ONLY LINE THAT DIFFERS across the sweep
  prune_grouping: global     # one threshold for the whole model; see note 3

data:
  calib_dataset: c4
  eval_dataset: wikitext2
  seqlen: 1024               # GPT-2's context window
  n_proxy_seq: 8             # fitness signal during the search
  n_eval_seq: 64             # full evaluation of the final front

search:
  algorithm: nsga2
  pop_size: 100
  n_gen: 100
  seed: 0

  # -- objectives -------------------------------------------------------------
  # Names match the keys in ModelCost.summary() (codec.py), plus `ppl_proxy`
  # for the fitness. Direction is implied by the name: everything is minimized
  # except the cr_* ratios, which are maximized and negated internally.
  objectives: [ppl_proxy, bpw_target, cr_archival]

  # Sweeps K and the pruning band together along one diagonal -- see point 1
  # above. This is NOT the fixed-bit baseline curve that the no-prune configs
  # start from.
  init: linspace
  warm_start: true
  baseline_sweep: true       # the 13 fixed-K reference points, all at t=0
  # Subsumed by `objectives` above; still selects the bpw measure used to
  # derive the frozen x box and the baseline sweep's printout. Keep it equal
  # to whichever bpw_* appears in `objectives` or the axes will not match.
  size_objective: bpw_target

  # -- NSGA-II operator controls ---------------------------------------------
  # pymoo gives each operator TWO probabilities. `prob` is the chance the
  # operator fires on an individual (or mating pair) at all; `prob_var` is the
  # chance each gene is touched once it has. The familiar "1/n_var" rule refers
  # to prob_var, and pymoo already defaults it to min(0.5, 1/n_var) -- so leave
  # mutation_prob_var null to get it. Putting 1/n_var into mutation_prob
  # instead silently mutates only 1/n_var of the population.
  #
  # Matched to gpt2_k_global_3obj.yaml so the pair isolates pruning. Note
  # mutation_prob is 0.9 here and 1.0 in the block and layer configs, which is
  # the one operator difference remaining across the three groupings.
  crossover_prob: 0.9        # per mating pair
  crossover_prob_var: 1.0    # per gene, given the pair crosses
  crossover_eta: 15          # SBX spread; higher = children hug their parents
  mutation_prob: 0.9         # per individual
  mutation_prob_var: 1.0     # per gene; null -> 1/n_var
  mutation_eta: 20           # PM spread; higher = smaller steps
  eliminate_duplicates: true
  n_offsprings: null         # null -> pop_size (generational)
  ref_dir_partitions: null   # unsga3/moead only; null -> ~pop_size directions
  moead_neighbors: 15
  moead_prob_neighbor_mating: 0.7

log:
  root: logs
  run_name: gpt2-k-global-3obj-prune-np100-ng100
  checkpoint_every: 10
  save_history: true

plot:
  enabled: true
  every: 1
  formats: [png, pdf]
  dpi: 150
  style: paper
  yscale: log
  # Absolute floor: 1.0 is the theoretical minimum, since perplexity is
  # exp(cross-entropy) and cross-entropy is non-negative. Overrides
  # ylim_min_ratio, is not padded, and refit never moves it.
  ylim_min: 1.0
  ylim_min_ratio: 0.8      # unused while ylim_min is set
  ylim_pad: 0.03            # breathing room at both ends, in decades
  # Ceiling, mirroring the floor. null = no cap: the box opens to the highest
  # reference point and refit_at_end raises it to cover every candidate, so
  # nothing is ever off-scale. Expect this to matter more than in the no-prune
  # runs -- a heavily pruned candidate can blow perplexity up by orders of
  # magnitude, and capping would hide rather than show that.
  ylim_max: null
  ylim_max_ratio: null
  legend_alpha: 0.3
  marker_pt: 3.5             # front/baseline marker diameter (pt)
  baseline_label: exponential search (baseline)
  annotation_pt: null        # null -> base font - 3 (5pt at the ieee preset)
  venue: ieee                # 3.5 in column figures, Times
  width: column
  video: [mp4, gif]
  video_fps: 6

# NOTE: the control for the no-prune sweep showed +0 non-dominated points from
# the third objective at global granularity, because one K is a one-parameter
# family. This config is the test of whether pruning alone -- 2 genes that f2
# cannot see -- is enough to open a third dimension even at n_k = 1. If the
# front here is still effectively 2-D, the separation depends on distributing
# K, not on sparsity, and that is a finding worth stating explicitly.
