# Tier 0 -- the "MNIST" config. Fast enough to iterate on a laptop.
# Purpose: debug the pipeline and sanity-check the accounting, not to produce
# publishable numbers.

model:
  name: gpt2                 # 124M
  dtype: float16
  device: cuda
  master_device: cuda

quant:
  granularity: per_channel   # one codebook per output channel
  binning: uniform           # the proposed method; ablate against quantile/kmeans
  k_choices: [2, 4, 8, 16, 32, 64, 128, 256]
  codebook_bits: 16

prune:
  enabled: true
  mode: sigma                # threshold = t * per-row weight std
  t_max: 2.0

variables:
  k_grouping: type           # 4 vars for GPT-2 (c_attn, c_proj, c_fc, c_proj)
  prune_grouping: global     # 2 vars

data:
  calib_dataset: c4
  eval_dataset: wikitext2
  seqlen: 1024               # GPT-2's context window
  n_proxy_seq: 8
  n_eval_seq: 64

search:
  algorithm: nsga2
  pop_size: 24
  n_gen: 20
  seed: 0
  warm_start: true
  size_objective: bpw_target

log:
  root: logs
  checkpoint_every: 5
  save_history: true

plot:
  enabled: true
  every: 1                   # a frame per generation; raise for long runs
  formats: [png, pdf]
  dpi: 150
  style: paper               # 'dark' for slides
  yscale: log                # perplexity spans orders of magnitude
  figsize: [7.0, 5.0]
  xlim: null                 # derived once from k_choices, then frozen
  ylim: null                 # derived once from the baselines, then frozen
